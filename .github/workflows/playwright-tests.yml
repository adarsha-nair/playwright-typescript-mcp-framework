name: Playwright Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

      test_category:
        description: "Test category to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
          - sanity

jobs:
  playwright:
    name: Playwright - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium-desktop
          - firefox-desktop
          - webkit-desktop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Set Environment Variables
        run: |
          echo "NODE_ENV=${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          CATEGORY="${{ github.event.inputs.test_category || 'all' }}"

          echo "Running Browser: ${{ matrix.browser }}"
          echo "Running Category: $CATEGORY"

          if [ "$CATEGORY" = "smoke" ]; then
            npx playwright test --project=${{ matrix.browser }} --grep "@smoke"
          elif [ "$CATEGORY" = "regression" ]; then
            npx playwright test --project=${{ matrix.browser }} --grep "@regression"
          elif [ "$CATEGORY" = "sanity" ]; then
            npx playwright test --project=${{ matrix.browser }} --grep "@sanity"
          else
            npx playwright test --project=${{ matrix.browser }}
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          retention-days: 30
          path: |
            playwright-report/
            reports/
            test-results/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          retention-days: 30
          path: |
            reports/screenshots/
            test-results/